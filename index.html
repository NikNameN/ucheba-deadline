<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1115" />
  <title>Учёба — АДМ-25-05</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0b0d12; --card:#161a22; --line:#2a3140; --txt:#eef1f6;
      --muted:#939bb0; --acc:#7eb0ff; --warn:#ffb020; --bad:#ff6b6b; --ok:#3dd68c;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); }
    header { padding: 18px 16px 12px; }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { margin:0; color:var(--muted); font-size:.9rem; }
    .panel { margin:0 16px 12px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
    label { display:block; font-size:.8rem; color:var(--muted); margin:10px 0 4px; }
    input, select {
      width:100%; padding:11px 12px; border-radius:10px;
      border:1px solid var(--line); background:#0f131a; color:var(--txt); font-size:1rem;
    }
    .combo { position:relative; }
    .suggest {
      position:absolute; left:0; right:0; top:100%; z-index:20;
      background:#121722; border:1px solid var(--line); border-radius:10px;
      margin-top:4px; max-height:220px; overflow:auto; display:none;
    }
    .suggest button {
      display:block; width:100%; margin:0; padding:10px 12px; border:0; border-radius:0;
      background:transparent; color:var(--txt); font-weight:500; font-size:.95rem; text-align:left;
    }
    .suggest button:hover, .suggest button.active { background:#1d2636; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button.submit {
      display:block; width:100%; margin-top:14px; padding:13px; border:0; border-radius:12px;
      background:var(--acc); color:#081018; font-weight:700; font-size:1rem;
    }
    .hint { margin:8px 0 0; color:var(--muted); font-size:.78rem; }
    .filters { display:flex; gap:8px; padding:0 16px 8px; overflow-x:auto; }
    .filters button { width:auto; margin:0; padding:8px 12px; border:0; border-radius:12px; background:#1a2030; color:var(--txt); font-weight:600; font-size:.85rem; }
    .filters button.on { background:var(--acc); color:#081018; }
    main { padding:4px 16px 40px; display:flex; flex-direction:column; gap:10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .card h2 { margin:0 0 4px; font-size:1.05rem; }
    .who { margin:0 0 8px; color:var(--muted); font-size:.88rem; }
    .meta { display:flex; flex-wrap:wrap; gap:6px; color:var(--muted); font-size:.82rem; }
    .tag { padding:2px 8px; border-radius:999px; background:#232833; }
    .soon { color:var(--warn); } .over { color:var(--bad); } .ok { color:var(--ok); }
    .actions { display:flex; gap:8px; margin-top:12px; }
    .actions a, .actions button {
      flex:1; padding:10px; border-radius:10px; border:0; font-weight:700; font-size:.9rem; text-align:center; text-decoration:none;
    }
    .actions a { background:#1d2636; color:var(--acc); }
    .actions button.del { background:#3a1c22; color:#ff8a8a; }
    .empty, .err { color:var(--muted); text-align:center; padding:24px 8px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>АДМ-25-05</h1>
    <p class="sub">Сначала предмет и тип — потом ФИО само.</p>
  </header>

  <form class="panel" id="form">
    <label>Название предмета</label>
    <div class="combo">
      <input id="subject" required autocomplete="off" placeholder="Начни вводить или выбери" />
      <div class="suggest" id="suggest"></div>
    </div>

    <div class="row">
      <div>
        <label>Тип</label>
        <select id="kind" required>
          <option value="лекция">лекция</option>
          <option value="семинар">семинар</option>
          <option value="лаба">лаба</option>
        </select>
      </div>
      <div>
        <label>Когда</label>
        <select id="when" required>
          <option value="once">однократно, дата</option>
          <option value="1">каждый понедельник</option>
          <option value="2">каждый вторник</option>
          <option value="3">каждую среду</option>
          <option value="4">каждый четверг</option>
          <option value="5">каждую пятницу</option>
          <option value="6">каждую субботу</option>
          <option value="0">каждое воскресенье</option>
        </select>
      </div>
    </div>

    <label>ФИО преподавателя</label>
    <select id="teacher" required>
      <option value="">сначала выбери предмет и тип</option>
    </select>

    <div id="dateWrap">
      <label>Дата</label>
      <input id="deadline" type="date" />
    </div>

    <button class="submit" type="submit">Добавить</button>
    <p class="hint">Препод берётся из расписания по паре предмет + лекция/семинар/лаба.</p>
  </form>

  <div class="filters">
    <button class="on" data-f="all">Все</button>
    <button data-f="soon">Скоро</button>
    <button data-f="over">Просрочено</button>
    <button data-f="лекция">Лекции</button>
    <button data-f="семинар">Семинары</button>
    <button data-f="лаба">Лабы</button>
  </div>
  <main id="list"><p class="empty">Загрузка…</p></main>

  <script>
    const OWNER = 'NikNameN';
    const REPO = 'ucheba-deadline';
    const CATALOG = [
      { subject: 'Аналитика технологических данных', byKind: { 'лекция': 'Шереужев М.А.', 'семинар': 'Шевченко М.Ю.', 'лаба': 'Шевченко М.Ю.' } },
      { subject: 'Сенсорные и управляющие системы роботов', byKind: { 'лекция': 'Андреев В.П.', 'семинар': 'Андреев В.П.', 'лаба': 'Андреев В.П.' } },
      { subject: 'Управление проектом', byKind: { 'лекция': 'Лукина С.В.', 'семинар': 'Лукина С.В.', 'лаба': 'Лукина С.В.' } },
      { subject: 'Программное обеспечение мехатронных систем', byKind: { 'лекция': 'Поливанов А.Ю.', 'семинар': 'Поливанов А.Ю.', 'лаба': 'Поливанов А.Ю.' } },
      { subject: 'Инструменты моделирования мехатронных и робототехнических систем', byKind: { 'лекция': 'Климов Д.Д.', 'семинар': 'Климов Д.Д.', 'лаба': 'Климов Д.Д.' } },
      { subject: 'Навигация и управление автономными мобильными роботами', byKind: { 'лекция': 'Собольников С.А.', 'семинар': 'Лапин Б.С.', 'лаба': 'Лапин Б.С.' } },
      { subject: 'Стоимостной инжиниринг', byKind: { 'лекция': 'Шинкевич И.А.', 'семинар': 'Шинкевич И.А.', 'лаба': 'Шинкевич И.А.' } }
    ];
    const DAY_LABEL = {
      0: 'каждое воскресенье', 1: 'каждый понедельник', 2: 'каждый вторник',
      3: 'каждую среду', 4: 'каждый четверг', 5: 'каждую пятницу', 6: 'каждую субботу'
    };

    const subjectEl = document.getElementById('subject');
    const teacherEl = document.getElementById('teacher');
    const kindEl = document.getElementById('kind');
    const suggest = document.getElementById('suggest');
    const whenEl = document.getElementById('when');
    const dateWrap = document.getElementById('dateWrap');
    const deadlineEl = document.getElementById('deadline');
    const list = document.getElementById('list');
    let all = [];
    let filter = 'all';
    let activeIdx = 0;

    function norm(s) { return (s || '').toLowerCase().replace(/ё/g, 'е'); }
    function findCourse(name) {
      const n = norm(name);
      return CATALOG.find((c) => norm(c.subject) === n)
        || CATALOG.find((c) => norm(c.subject).includes(n) && n.length > 4);
    }
    function uniqueTeachers(c) {
      return [...new Set(Object.values(c.byKind))];
    }
    function fillTeacher() {
      const c = findCourse(subjectEl.value.trim());
      if (!c) {
        teacherEl.innerHTML = '<option value="">сначала выбери предмет и тип</option>';
        return;
      }
      subjectEl.value = c.subject;
      const kind = kindEl.value;
      const chosen = c.byKind[kind] || uniqueTeachers(c)[0];
      const names = uniqueTeachers(c);
      teacherEl.innerHTML = names.map((n) => {
        const mark = n === chosen ? ' selected' : '';
        const note = n === c.byKind['лекция'] && n === c.byKind['семинар'] ? '' :
          (n === c.byKind['лекция'] ? ' — лекция' : ' — семинар/лаба');
        return '<option value="' + n + '"' + mark + '>' + n + note + '</option>';
      }).join('');
      teacherEl.value = chosen;
    }
    function renderSuggest(q) {
      const n = norm(q);
      const items = CATALOG.filter((c) => !n || norm(c.subject).includes(n));
      if (!items.length) { suggest.style.display = 'none'; return; }
      activeIdx = 0;
      suggest.innerHTML = items.map((c, i) =>
        '<button type="button" data-i="' + i + '" class="' + (i === 0 ? 'active' : '') + '">' + c.subject + '</button>'
      ).join('');
      suggest.style.display = 'block';
      suggest.querySelectorAll('button').forEach((b) => {
        b.onmousedown = (e) => { e.preventDefault(); pick(items[+b.dataset.i]); };
      });
    }
    function pick(c) {
      subjectEl.value = c.subject;
      fillTeacher();
      suggest.style.display = 'none';
    }
    subjectEl.addEventListener('focus', () => renderSuggest(subjectEl.value));
    subjectEl.addEventListener('input', () => { renderSuggest(subjectEl.value); fillTeacher(); });
    subjectEl.addEventListener('blur', () => setTimeout(() => { suggest.style.display = 'none'; fillTeacher(); }, 150));
    subjectEl.addEventListener('keydown', (e) => {
      const buttons = [...suggest.querySelectorAll('button')];
      if (!buttons.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, buttons.length - 1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); }
      buttons.forEach((b, i) => b.classList.toggle('active', i === activeIdx));
      if (e.key === 'Enter' && suggest.style.display === 'block') {
        e.preventDefault();
        buttons[activeIdx].dispatchEvent(new Event('mousedown'));
      }
    });
    kindEl.addEventListener('change', fillTeacher);

    function toggleDate() {
      const once = whenEl.value === 'once';
      dateWrap.classList.toggle('hidden', !once);
      deadlineEl.required = once;
    }
    whenEl.addEventListener('change', toggleDate);
    toggleDate();

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      fillTeacher();
      const subject = subjectEl.value.trim();
      const teacher = teacherEl.value.trim();
      const kind = kindEl.value;
      const when = whenEl.value;
      const deadline = deadlineEl.value;
      if (!teacher) { teacherEl.focus(); return; }
      if (when === 'once' && !deadline) { deadlineEl.focus(); return; }
      const schedule = when === 'once' ? 'однократно' : DAY_LABEL[when];
      const body = [
        '### Предмет', subject,
        '', '### ФИО преподавателя', teacher,
        '', '### Тип', kind,
        '', '### Расписание', schedule,
        '', '### Дата', when === 'once' ? deadline : '—'
      ].join('\n');
      location.href = 'https://github.com/' + OWNER + '/' + REPO + '/issues/new?labels=zadanie'
        + '&title=' + encodeURIComponent(kind + ': ' + subject)
        + '&body=' + encodeURIComponent(body);
    });

    document.querySelectorAll('.filters button').forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll('.filters button').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        filter = b.dataset.f;
        render();
      };
    });

    function parseField(body, name) {
      if (!body) return '';
      const re = new RegExp('(?:###\\s*)?' + name + '\\s*\\n+([^\\n#]+)', 'i');
      const m = body.match(re);
      return m ? m[1].trim() : '';
    }
    function weekdayFromSchedule(s) {
      s = (s || '').toLowerCase();
      if (s.includes('воскр')) return 0;
      if (s.includes('понед')) return 1;
      if (s.includes('втор')) return 2;
      if (s.includes('сред')) return 3;
      if (s.includes('четвер')) return 4;
      if (s.includes('пятн')) return 5;
      if (s.includes('субб')) return 6;
      return null;
    }
    function nextWeekday(wd) {
      const d = new Date(); d.setHours(0,0,0,0);
      const diff = (wd - d.getDay() + 7) % 7;
      d.setDate(d.getDate() + diff);
      return d;
    }
    function daysLeftDate(iso) {
      if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return null;
      const d = new Date(iso.slice(0,10) + 'T23:59:59');
      if (isNaN(d)) return null;
      return Math.ceil((d - new Date()) / 86400000);
    }
    function cls(n) {
      if (n == null) return '';
      if (n < 0) return 'over';
      if (n <= 1) return 'soon';
      return 'ok';
    }
    function whenText(t) {
      if (t.wd != null) {
        if (t.left === 0) return DAY_LABEL[t.wd] + ' · сегодня';
        if (t.left === 1) return DAY_LABEL[t.wd] + ' · завтра';
        return DAY_LABEL[t.wd];
      }
      if (!t.deadline) return 'без даты';
      if (t.left < 0) return t.deadline + ' · просрочено на ' + (-t.left) + ' дн.';
      if (t.left === 0) return t.deadline + ' · сегодня';
      if (t.left === 1) return t.deadline + ' · завтра';
      return t.deadline + ' · ещё ' + t.left + ' дн.';
    }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({
        '&':'&','<':'<','>':'>','"':'"',"'":'&#39;'
      }[c]));
    }
    function normalize(i) {
      const subject = parseField(i.body, 'Предмет') || i.title;
      const teacher = parseField(i.body, 'ФИО преподавателя');
      const kind = parseField(i.body, 'Тип');
      const schedule = parseField(i.body, 'Расписание') || parseField(i.body, 'Повтор');
      const deadline = parseField(i.body, 'Дата') || parseField(i.body, 'Дедлайн');
      const wd = weekdayFromSchedule(schedule);
      let left = null;
      if (wd != null) left = Math.ceil((nextWeekday(wd).setHours(23,59,59,0) - Date.now()) / 86400000);
      else left = daysLeftDate(deadline);
      return Object.assign({}, i, { subject, teacher, kind, schedule, deadline, wd, left });
    }
    function render() {
      let tasks = all;
      if (filter === 'soon') tasks = all.filter((t) => t.left != null && t.left >= 0 && t.left <= 1);
      else if (filter === 'over') tasks = all.filter((t) => t.wd == null && t.left != null && t.left < 0);
      else if (filter === 'лекция' || filter === 'семинар' || filter === 'лаба') tasks = all.filter((t) => t.kind === filter);
      if (!tasks.length) { list.innerHTML = '<p class="empty">Пока пусто.</p>'; return; }
      list.innerHTML = tasks.map((t) => `
        <article class="card">
          <h2>${escapeHtml(t.kind ? t.kind + ': ' + t.subject : t.title)}</h2>
          <p class="who">${escapeHtml(t.teacher || '')}</p>
          <div class="meta">
            <span class="tag ${cls(t.left)}">${escapeHtml(whenText(t))}</span>
            ${t.kind ? '<span class="tag">' + escapeHtml(t.kind) + '</span>' : ''}
          </div>
          <div class="actions">
            <a href="${t.html_url}">Открыть</a>
            <button type="button" class="del" data-url="${t.html_url}">Удалить</button>
          </div>
        </article>`).join('');
      list.querySelectorAll('button.del').forEach((btn) => {
        btn.onclick = () => {
          if (!confirm('Удалить этот дедлайн?\nНа GitHub нажми «Close issue».')) return;
          location.href = btn.dataset.url;
        };
      });
    }
    fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/issues?state=open&labels=zadanie&per_page=50')
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .catch(() => fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/issues?state=open&per_page=50').then((r) => r.json()))
      .then((items) => {
        all = (items || []).filter((i) => !i.pull_request).map(normalize)
          .sort((a, b) => (a.left ?? 999) - (b.left ?? 999));
        render();
      })
      .catch(() => { list.innerHTML = '<p class="err">Список не загрузился.</p>'; });
  </script>
</body>
</html>
