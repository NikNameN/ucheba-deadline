<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Учёба — дедлайны</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --txt:#e8eaed; --muted:#9aa3b2; --acc:#6ea8fe; --warn:#ffb020; --bad:#ff6b6b; --ok:#3dd68c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--txt); }
    header { padding: 18px 16px 8px; position:sticky; top:0; background:linear-gradient(var(--bg), rgba(15,17,21,.92)); }
    h1 { font-size: 1.25rem; margin:0 0 6px; }
    p.sub { margin:0 0 12px; color:var(--muted); font-size:.9rem; }
    .bar { display:flex; gap:8px; }
    a.btn, button.btn { flex:1; text-align:center; text-decoration:none; color:#081018; background:var(--acc); border:0; border-radius:12px; padding:12px; font-weight:600; font-size:.95rem; }
    a.btn.ghost { background:transparent; color:var(--acc); border:1px solid #3a4660; }
    main { padding: 8px 16px 32px; display:flex; flex-direction:column; gap:10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .card h2 { margin:0 0 6px; font-size:1.05rem; }
    .meta { color:var(--muted); font-size:.85rem; display:flex; flex-wrap:wrap; gap:8px; }
    .tag { padding:2px 8px; border-radius:999px; background:#232833; }
    .soon { color:var(--warn); }
    .over { color:var(--bad); }
    .ok { color:var(--ok); }
    .empty, .err { color:var(--muted); padding:24px 8px; text-align:center; }
  </style>
</head>
<body>
  <header>
    <h1>Учёбные задания</h1>
    <p class="sub">Общий список. Добавление и правка — через GitHub с телефона.</p>
    <div class="bar">
      <a class="btn" href="https://github.com/NikNameN/ucheba-deadline/issues/new?template=zadanie.yml">+ Добавить</a>
      <a class="btn ghost" href="https://github.com/NikNameN/ucheba-deadline/issues">Все issues</a>
    </div>
  </header>
  <main id="list"><p class="empty">Загрузка…</p></main>
  <script>
    const OWNER = 'NikNameN';
    const REPO = 'ucheba-deadline';
    const list = document.getElementById('list');
    function parseField(body, name) {
      if (!body) return '';
      const re = new RegExp('(?:###\\s*)?' + name + '\\s*\\n+([^\\n#]+)', 'i');
      const m = body.match(re);
      return m ? m[1].trim() : '';
    }
    function daysLeft(iso) {
      if (!iso) return null;
      const d = new Date(iso + 'T23:59:59');
      if (isNaN(d)) return null;
      return Math.ceil((d - new Date()) / 86400000);
    }
    function cls(n) {
      if (n == null) return '';
      if (n < 0) return 'over';
      if (n <= 2) return 'soon';
      return 'ok';
    }
    function label(n) {
      if (n == null) return 'без даты';
      if (n < 0) return 'просрочено на ' + (-n) + ' дн.';
      if (n === 0) return 'сегодня';
      if (n === 1) return 'завтра';
      return 'ещё ' + n + ' дн.';
    }
    fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/issues?state=open&per_page=50')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(items => {
        const tasks = items.filter(i => !i.pull_request).map(i => {
          const deadline = parseField(i.body, 'Дедлайн');
          const repeat = parseField(i.body, 'Повтор') || 'однократно';
          const subject = parseField(i.body, 'Предмет');
          return { ...i, deadline, repeat, subject, left: daysLeft(deadline) };
        }).sort((a,b) => {
          if (a.left == null) return 1;
          if (b.left == null) return -1;
          return a.left - b.left;
        });
        if (!tasks.length) {
          list.innerHTML = '<p class="empty">Пока пусто. Нажми «Добавить».</p>';
          return;
        }
        list.innerHTML = tasks.map(t => `
          <a class="card" href="${t.html_url}" style="display:block;color:inherit;text-decoration:none">
            <h2>${t.title.replace(/</g,'')}</h2>
            <div class="meta">
              <span class="tag ${cls(t.left)}">${t.deadline || '—'} · ${label(t.left)}</span>
              <span class="tag">${t.repeat}</span>
              ${t.subject ? '<span class="tag">' + t.subject + '</span>' : ''}
              <span class="tag">@${t.user.login}</span>
            </div>
          </a>`).join('');
      })
      .catch(() => {
        list.innerHTML = '<p class="err">Не удалось загрузить список. Открой issues на GitHub.</p>';
      });
  </script>
</body>
</html>
